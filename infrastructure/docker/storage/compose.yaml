name: excel-dashboard-storage
services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:?Set SEAWEEDFS_VERSION}
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped
  storage-init:
    image: amazon/aws-cli:${AWS_CLI_VERSION:?Set AWS_CLI_VERSION}
    depends_on:
      seaweedfs:
        condition: service_started
    entrypoint:
      - /bin/sh
      - /config/initialize.sh
    environment:
      AWS_ACCESS_KEY_ID: local-admin-access-key
      AWS_SECRET_ACCESS_KEY: local-admin-secret-key
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: excel-dashboard-local
    volumes:
      - ./initialize.sh:/config/initialize.sh:ro
      - ./cors.json:/config/cors.json:ro
    restart: 'no'
volumes:
  seaweedfs-data:
